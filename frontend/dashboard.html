<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SDCKL Attendance System - Dashboard</title>
  <link href="https://cdn.tailwindcss.com" rel="stylesheet" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <style>
    body {
      font-family: 'Roboto', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <nav class="bg-blue-600 text-white p-4 flex justify-between items-center">
    <h1 class="text-xl font-bold">SDCKL Attendance System</h1>
    <a href="index.html" class="hover:underline">Logout</a>
  </nav>
  <main class="p-6 max-w-7xl mx-auto">
    <h2 class="text-2xl font-semibold mb-6">Dashboard</h2>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <a href="students.html" class="bg-white p-6 rounded shadow hover:shadow-lg transition flex flex-col items-center">
        <i class="fas fa-user-graduate text-4xl mb-4 text-blue-600"></i>
        <span class="text-lg font-semibold">Manage Students</span>
      </a>
      <a href="attendance.html" class="bg-white p-6 rounded shadow hover:shadow-lg transition flex flex-col items-center">
        <i class="fas fa-calendar-check text-4xl mb-4 text-green-600"></i>
        <span class="text-lg font-semibold">Attendance Logging</span>
      </a>
      <a href="reports.html" class="bg-white p-6 rounded shadow hover:shadow-lg transition flex flex-col items-center">
        <i class="fas fa-chart-bar text-4xl mb-4 text-purple-600"></i>
        <span class="text-lg font-semibold">Reports</span>
      </a>
    </div>
  </main>
</body>
</html>
