<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SDCKL Attendance System - Manage Students</title>
  <link href="https://cdn.tailwindcss.com" rel="stylesheet" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <style>
    body {
      font-family: 'Roboto', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <nav class="bg-blue-600 text-white p-4 flex justify-between items-center">
    <h1 class="text-xl font-bold">SDCKL Attendance System</h1>
    <a href="dashboard.html" class="hover:underline">Dashboard</a>
  </nav>
  <main class="p-6 max-w-7xl mx-auto">
    <h2 class="text-2xl font-semibold mb-6">Manage Students</h2>
    <form id="studentForm" class="mb-6 bg-white p-6 rounded shadow space-y-4">
      <div>
        <label for="studentId" class="block font-semibold mb-1">Student ID</label>
        <input type="text" id="studentId" name="studentId" required class="w-full border border-gray-300 rounded px-3 py-2" />
      </div>
      <div>
        <label for="firstName" class="block font-semibold mb-1">First Name</label>
        <input type="text" id="firstName" name="firstName" required class="w-full border border-gray-300 rounded px-3 py-2" />
      </div>
      <div>
        <label for="lastName" class="block font-semibold mb-1">Last Name</label>
        <input type="text" id="lastName" name="lastName" required class="w-full border border-gray-300 rounded px-3 py-2" />
      </div>
      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">Add Student</button>
    </form>
    <div class="bg-white p-6 rounded shadow">
      <h3 class="text-xl font-semibold mb-4">Student List</h3>
      <table class="w-full table-auto border-collapse border border-gray-300">
        <thead>
          <tr class="bg-gray-200">
            <th class="border border-gray-300 px-4 py-2">Student ID</th>
            <th class="border border-gray-300 px-4 py-2">First Name</th>
            <th class="border border-gray-300 px-4 py-2">Last Name</th>
            <th class="border border-gray-300 px-4 py-2">Remarks</th>
            <th class="border border-gray-300 px-4 py-2">Late Count</th>
            <th class="border border-gray-300 px-4 py-2">Actions</th>
          </tr>
        </thead>
        <tbody id="studentTableBody"></tbody>
      </table>
    </div>
  </main>
  <script>
    const apiBase = '/api/students';

    async function fetchStudents() {
      const res = await fetch(apiBase);
      const students = await res.json();
      const tbody = document.getElementById('studentTableBody');
      tbody.innerHTML = '';
      students.forEach(student => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="border border-gray-300 px-4 py-2">${student.studentId}</td>
          <td class="border border-gray-300 px-4 py-2">${student.firstName}</td>
          <td class="border border-gray-300 px-4 py-2">${student.lastName}</td>
          <td class="border border-gray-300 px-4 py-2">${student.remarks || ''}</td>
          <td class="border border-gray-300 px-4 py-2">${student.lateCount}</td>
          <td class="border border-gray-300 px-4 py-2">
            <button onclick="deleteStudent(${student.id})" class="text-red-600 hover:underline">Delete</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function addStudent(event) {
      event.preventDefault();
      const form = event.target;
      const data = {
        studentId: form.studentId.value,
        firstName: form.firstName.value,
        lastName: form.lastName.value,
      };
      const res = await fetch(apiBase, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      if (res.ok) {
        form.reset();
        fetchStudents();
      } else {
        alert('Failed to add student');
      }
    }

    async function deleteStudent(id) {
      if (!confirm('Are you sure you want to delete this student?')) return;
      const res = await fetch(\`\${apiBase}/\${id}\`, { method: 'DELETE' });
      if (res.ok) {
        fetchStudents();
      } else {
        alert('Failed to delete student');
      }
    }

    document.getElementById('studentForm').addEventListener('submit', addStudent);
    fetchStudents();
  </script>
</body>
</html>
